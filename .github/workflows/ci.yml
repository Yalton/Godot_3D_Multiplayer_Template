name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test MultiplayerTemplate.Tests/MultiplayerTemplate.Tests.csproj --verbosity minimal
